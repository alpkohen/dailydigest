name: worker

on:
  schedule:
    # 05:30 Europe/Istanbul (UTC+3, no DST) = 02:30 UTC. Owner-set fixed
    # delivery time; not read from profiles.brief_time (see Settings page).
    # Runs the daily pipeline: collect, then compose_brief, deliver and
    # retention (worker/src/index.ts ALL_STAGE_ORDER).
    - cron: "30 2 * * *"
    # Every 2 hours: collect (ingest, watch_ingest, match, group) so the app
    # stays current through the day. Each run only handles what's new since
    # the last one.
    - cron: "15 */2 * * *"
  workflow_dispatch:
    inputs:
      stage:
        description: "Stage to run (omit + all=true for the full pipeline, or collect=true for every stage short of compose_brief/deliver)"
        required: false
        default: "ping"
      date:
        description: "YYYY-MM-DD (defaults to today)"
        required: false
      all:
        description: "Run the full pipeline instead of a single stage"
        required: false
        default: "false"
      collect:
        description: "Run every stage up to compose_brief/deliver (same as the every-3-hours schedule)"
        required: false
        default: "false"
      budget_usd:
        description: "Max LLM spend (USD) for this run; further LLM calls are refused once reached. Empty = no cap."
        required: false

concurrency:
  group: dailydigest-worker
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    # The simplified pipeline (feed metadata only, batched matching) runs in
    # minutes; anything near this limit is a hang, not real work.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          # @supabase/supabase-js needs a native WebSocket, which Node 20
          # doesn't provide - every workflow_dispatch run failed at client
          # creation until this was bumped (discovered while testing email
          # delivery for the first time).
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Run worker
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          OWNER_ID: ${{ secrets.OWNER_ID }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          BRIEF_RECIPIENT_EMAIL: ${{ secrets.BRIEF_RECIPIENT_EMAIL }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
          HMAC_SECRET: ${{ secrets.HMAC_SECRET }}
          WEB_APP_URL: ${{ secrets.WEB_APP_URL }}
          # Kill switch: `gh variable set WORKER_BACKGROUND_PAUSED --body true`
          # stops every run (scheduled and manual) from doing real work,
          # `gh variable set WORKER_BACKGROUND_PAUSED --body false` resumes -
          # no code change or redeploy needed either way.
          WORKER_BACKGROUND_PAUSED: ${{ vars.WORKER_BACKGROUND_PAUSED }}
          LLM_RUN_BUDGET_USD: ${{ github.event.inputs.budget_usd || vars.LLM_RUN_BUDGET_USD }}
        run: |
          if [ "${{ github.event.schedule }}" = "15 */2 * * *" ] || [ "${{ github.event.inputs.collect }}" = "true" ]; then
            pnpm worker:run --collect
          elif [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event.inputs.all }}" = "true" ]; then
            pnpm worker:run --all
          else
            pnpm worker:run --stage="${{ github.event.inputs.stage || 'ping' }}" --date="${{ github.event.inputs.date }}"
          fi
