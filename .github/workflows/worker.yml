name: worker

on:
  schedule:
    # 05:30 Europe/Istanbul (UTC+3, no DST) = 02:30 UTC. Owner-set fixed
    # delivery time; not read from profiles.brief_time (see Settings page).
    # Runs the full pipeline in stage order (seed_sources, ingest, extract;
    # more stages land as later milestones are built).
    - cron: "30 2 * * *"
    # Every 3 hours: runs every stage up to (not including) compose_brief/
    # deliver (worker/src/index.ts's COLLECT_STAGE_ORDER). Those stages read
    # and write by row status, never by date, so running them repeatedly
    # through the day is just incremental work - whatever's new since the
    # last pass. This is what the 02:30 run used to do cold, in one
    # multi-hour batch (ingest alone routinely 30-40 min, relevance 45-60
    # min): by delivery time most of it is already done, so 02:30 only has
    # a few hours' stragglers left plus compose_brief/deliver.
    - cron: "0 */3 * * *"
  workflow_dispatch:
    inputs:
      stage:
        description: "Stage to run (omit + all=true for the full pipeline, or collect=true for every stage short of compose_brief/deliver)"
        required: false
        default: "ping"
      date:
        description: "YYYY-MM-DD (defaults to today)"
        required: false
      all:
        description: "Run the full pipeline instead of a single stage"
        required: false
        default: "false"
      collect:
        description: "Run every stage up to compose_brief/deliver (same as the every-3-hours schedule)"
        required: false
        default: "false"

concurrency:
  group: dailydigest-worker
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    # Safety net alongside the new fetch timeout in packages/db/src/client.ts:
    # GitHub's own default (360 minutes) let a hung run sit all morning with
    # no email ever sent. 45 min turned out too tight for a real --all run:
    # ingest alone (many slow/paywalled sources, no per-item cap) regularly
    # takes 30-40 min on its own. 90 min then also turned out too tight -
    # relevance alone (LLM call per item x topic) was observed live taking
    # 30+ minutes for a small few-hundred-item subset, which scales to well
    # over an hour on a normal 1500-3000 item day, before cluster/score/
    # enrich/compose_brief/deliver even run. 180 min gives real headroom for
    # a genuine full day while still well short of GitHub's own 360 min cap.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          # @supabase/supabase-js needs a native WebSocket, which Node 20
          # doesn't provide - every workflow_dispatch run failed at client
          # creation until this was bumped (discovered while testing email
          # delivery for the first time).
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Run worker
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          OWNER_ID: ${{ secrets.OWNER_ID }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          BRIEF_RECIPIENT_EMAIL: ${{ secrets.BRIEF_RECIPIENT_EMAIL }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
          HMAC_SECRET: ${{ secrets.HMAC_SECRET }}
          WEB_APP_URL: ${{ secrets.WEB_APP_URL }}
          # Kill switch: `gh variable set WORKER_BACKGROUND_PAUSED --body true`
          # stops every run (scheduled and manual) from doing real work,
          # `gh variable set WORKER_BACKGROUND_PAUSED --body false` resumes -
          # no code change or redeploy needed either way.
          WORKER_BACKGROUND_PAUSED: ${{ vars.WORKER_BACKGROUND_PAUSED }}
        run: |
          if [ "${{ github.event.schedule }}" = "0 */3 * * *" ] || [ "${{ github.event.inputs.collect }}" = "true" ]; then
            pnpm worker:run --collect
          elif [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event.inputs.all }}" = "true" ]; then
            pnpm worker:run --all
          else
            pnpm worker:run --stage="${{ github.event.inputs.stage || 'ping' }}" --date="${{ github.event.inputs.date }}"
          fi
