# Initial source registry.
# Feed URLs are intentionally left as TODO: Claude Code must find and verify
# each feed during milestone 1 (fetch, check recent items, record health).
# Perspective group assignments are a starting point for the owner to review.

perspective_groups:
  - id: tr_gov_aligned
    name: "TR hükümete yakın"
  - id: tr_opposition_independent
    name: "TR muhalif / bağımsız"
  - id: tr_foreign_public
    name: "Yabancı kamu yayıncılarının Türkçe servisleri"
  - id: western
    name: "Batı medyası ve düşünce kuruluşları"
  - id: regional
    name: "Bölgesel (Orta Doğu, Kafkasya, Balkanlar)"
