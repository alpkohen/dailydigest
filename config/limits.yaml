# Budget, thresholds, alert caps. CLAUDE.md rule 1, SPEC.md section 13.
# All values are starting points; tune once real volumes are observed (M1+).

# Hard daily cap on LLM spend, enforced by the worker from llm_calls. Once
# reached, LLM steps stop for the day; ingest and keyword matching continue.
daily_budget_usd: 2.00
budget_warning_threshold_pct: 80

max_items_per_source_per_run: 100

# Simplified pipeline (ingest -> match -> group -> daily brief).
pipeline:
  ingest_concurrency: 8
  match_batch_size: 60
  # Small on purpose: at 60 the model's output (a Turkish title+summary per
  # new event) overran the token limit and came back truncated.
  group_batch_size: 20
  # Events older than this stop accepting new articles.
  group_window_hours: 48
  # A newly created topic is matched against this many days of stored items.
  topic_backfill_days: 7
  # Unmatched items older than this are deleted (saved/watched ones kept).
  retention_unmatched_days: 90
  # Max stories per section in the daily email; the app shows everything.
  brief_section_caps:
    critical: 6
    follow_up: 10
    worth_reading: 10
  # GDELT/Exa topic-query expansion: off. It produced most of the volume,
  # failures and Exa cost, and isn't needed to cover the configured sources.
  use_search_apis: false
  # Coverage-gap warnings per topic (app and email). A topic is flagged when
  # fewer than min_sources sources or min_items items matched it within
  # window_days; a source that fed the topic within contributor_window_days
  # and is now broken or degraded is flagged too.
  coverage:
    window_days: 7
    min_sources: 3
    min_items: 3
    contributor_window_days: 30
  # Topic-driven source suggestions: up to max_per_topic candidates per
  # topic, kept only if their feed or sitemap has an item within fresh_days.
  # topics_per_run bounds the work (and LLM calls) of one run.
  source_suggestions:
    max_per_topic: 8
    fresh_days: 14
    topics_per_run: 3

thresholds:
  relevance_default: 5.0
  # Embedding cosine pre-filter before the relevance LLM call runs at all
  # (SPEC.md section 6, stage 5: "avoid scoring everything against
  # everything"). Below this, an item/topic pair is skipped entirely.
  relevance_prefilter_cosine: 0.2
  cluster_high: 0.90
  cluster_low: 0.75
  dedup_simhash_distance: 3
  dedup_cosine: 0.95

alerts:
  max_per_day: 3
  quiet_hours_start: "23:00"
  quiet_hours_end: "07:00"
